# docker-compose.yml — KEFA AI
#
# Se omite la clave "version": está deprecada en Docker Compose v2+.
#
# Servicios ACTIVOS:
#   - db       (PostgreSQL)
#   - n8n      (automatización — KEFA-ADR-004 ✅ APPROVED)
#   - backend  (Django + DRF)
#   - frontend (Vite + React)
#
# KEFA-ADR-004: imagen oficial docker.n8n.io/n8nio/n8n, versión fijada
# (nunca "latest"/"next"/"nightly"), backend de BD de n8n en PostgreSQL
# (no SQLite), credenciales sensibles vía Docker secrets (_FILE), nunca
# como variable plana. Ver docs/deployment/control-de-estado.md.
#
# backend: config/settings.py no soporta el sufijo _FILE para
# credenciales (solo os.getenv("POSTGRES_PASSWORD") plano), así que
# su imagen incluye un entrypoint que exporta la variable a partir del
# Docker secret antes de arrancar Django. Ver backend/docker-entrypoint.sh.
#
# frontend: VITE_API_URL vive en frontend/.env (no en el .env raíz),
# ya que lo consume el navegador (código del cliente), no el proceso
# Docker — debe apuntar a http://localhost:8000 (puerto publicado al
# host), nunca a "backend" (nombre de red interna de Docker, que el
# navegador no puede resolver).
#
# Variables no sensibles se leen de ".env" (copia ".env.example").
# La contraseña de Postgres NO va en .env: ver secrets/postgres_password.txt.example

services:
  db:
    # Actualizado de 16→17: n8n reportó en runtime que Postgres 16 solo
    # recibe soporte de compatibilidad, recomienda 17+. Sin datos reales
    # en el volumen todavía, se actualizó de inmediato en vez de arrastrar
    # deuda técnica.
    image: postgres:17-alpine
    container_name: kefa-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      # Solo para depuración local (ej. cliente psql/DBeaver desde el host).
      # Evaluar remover este mapeo en un entorno de producción real.
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Script de inicialización: crea la base de datos separada para n8n
      # (n8n_db) la primera vez que se crea el volumen. Solo corre una vez.
      - ./docker/postgres/init-n8n-db.sh:/docker-entrypoint-initdb.d/init-n8n-db.sh:ro
    networks:
      - kefa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  n8n:
    # KEFA-ADR-004: imagen oficial + versión fijada. Verificar en el Hub
    # (pestaña Tags de docker.n8n.io/n8nio/n8n) si existe un patch más
    # reciente de la serie 2.40 antes de confirmar este tag como definitivo.
    image: docker.n8n.io/n8nio/n8n:2.40.7
    container_name: kefa-n8n
    restart: unless-stopped
    env_file:
      - .env
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: ${N8N_PORT}
      # Renombrado de WEBHOOK_URL (deprecada) a N8N_WEBHOOK_URL, según
      # aviso de deprecación real visto en los logs de n8n 2.40.7.
      N8N_WEBHOOK_URL: ${N8N_BASE_URL}
      # KEFA-ADR-004: backend de BD de n8n en Postgres, no SQLite.
      # Base de datos separada (n8n_db) dentro del mismo servidor Postgres
      # (supuesto técnico, no explícito en la ADR — ver ANÁLISIS).
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n_db
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "${N8N_PORT}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - kefa-network
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kefa-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # settings.py solo lee POSTGRES_PASSWORD como variable plana (no
      # soporta _FILE): el entrypoint de la imagen la exporta a partir
      # de este secreto antes de arrancar Django (KEFA-ADR-004).
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      # 8000 y 8001 caen dentro de un rango excluido por Windows/Hyper-V
      # en la máquina de Alan (netsh interface ipv4 show excludedportrange
      # → 7535-8034 excluido). 8080 está fuera de ese rango y del otro
      # rango excluido (50000-50059). El contenedor sigue usando 8000
      # internamente, backend/manage.py runserver no cambia.
      - "8080:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kefa-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kefa-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Volumen anónimo: evita que el bind-mount de arriba sobreescriba
      # el node_modules instalado DENTRO de la imagen (Linux) con el de
      # tu host (Windows/macOS), que puede tener binarios incompatibles.
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - kefa-network

volumes:
  postgres_data:
  n8n_data:

networks:
  kefa-network:
    driver: bridge

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt